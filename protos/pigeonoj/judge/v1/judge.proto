// PigeonOJ 判题节点网关协议 v1（docs/contracts/judge.md「节点网关协议」节）
//
// 连接方向：判题节点 ──出站──▶ 后端 :50051（节点侧无需开放入站端口，天然穿 NAT）。
// 认证：Connect 首条消息携带注册令牌（后端 JUDGE_GATEWAY_TOKENS 配置其一）；
//       FetchProblemData 通过 metadata "x-node-token" 携带同一令牌。
syntax = "proto3";

package pigeonoj.judge.v1;

service JudgeGateway {
  // 节点生命周期主通道：上行 register/heartbeat/result，下行 job。
  // 断开即视为节点离线；其名下 in-flight 作业由服务端重置为 pending 重派。
  rpc Connect(stream NodeMessage) returns (stream ServerMessage);

  // 题目数据拉取：按 data_version 惰性传输测试点与 SPJ，
  // 节点按 <problem_id>-<data_version> 缓存到本地磁盘后复用。
  rpc FetchProblemData(ProblemDataRequest) returns (stream FileChunk);
}

// ── 服务端 → 节点 ──────────────────────────────────────────────

message ServerMessage {
  oneof payload {
    RegisterAck ack = 1;
    SubmitJob job = 2;
    CancelJob cancel = 3; // 预留：节点断线前主动撤销执行中作业
    RunCodeJob run_code = 4; // 用户自测（一次性运行，不落库、不计分）
  }
}

message RegisterAck {
  string node_id = 1;      // 服务端确认/规整后的节点 ID
  int32 heartbeat_interval_seconds = 2;
}

message ResourceLimits {
  int32 time_limit_ms = 1;   // 已按语言比例换算的有效值
  int32 memory_limit_mb = 2;
  int32 output_limit_kb = 3;
  int32 process_limit = 4;
  int32 cpu_cores = 5;
}

message TestCaseFile {
  string test_case_id = 1;  // test_cases.id（回传结果时关联）
  string name = 2;          // 展示名，如 case1 / sample1
  // [已废弃] 出题不设分值，分数由服务端按通过比例派生；字段号保留维持线格式兼容
  int32 score = 3;
  // 数据本体不内联：节点凭 data_version 经 FetchProblemData 拉取并缓存，
  // 文件约定 cases/<test_case_id>.in 与 .out。
}

message SubmitJob {
  string submission_id = 1;
  string language = 2;      // python3.12 / cpp17 / java21
  bytes code = 3;           // 提交源码 ≤64KB，内联
  ResourceLimits limits = 4;
  string problem_id = 5;
  string data_version = 6;  // 数据指纹；缓存未命中时先调 FetchProblemData
  bool spj = 7;             // [已废弃] SPJ 特判整体移除；字段号保留维持线格式兼容，发送端不再赋值，接收端忽略
  repeated TestCaseFile cases = 8; // 仅元数据 + 排序；正式测试点（is_sample=false）
}

message CancelJob { string submission_id = 1; }

// 用户自测作业：单次独立运行，无测试点、无比对、不落库（docs/contracts/judge.md「用户自测」）。
// 后端按 node 回传 request_id 关联；作业随节点断线作废。
message RunCodeJob {
  string request_id = 1;     // 网关生成的关联 ID（uuid4 hex）
  string language = 2;       // python3.12 / cpp17 / java21
  bytes code = 3;            // 源码 ≤64KB，内联
  bytes input = 4;           // 用户自定义 stdin（≤64KB，可为空）
  ResourceLimits limits = 5; // 已按语言比例换算的有效值（基准取题目限制）
}

message RunCodeResult {
  string request_id = 1;
  string status = 2;        // ok / compile_error / runtime_error / tle 系列 / system_error
  bytes output = 3;         // 程序标准输出（已按输出上限截断）；仅回传 stdout，不含期望输出比对
  string error_message = 4; // 编译 / 运行错误摘要（stderr 过滤 nsjail 日志，≤8KB）
  int32 time_used_ms = 5;
  int32 memory_used_kb = 6;
}

// ── 节点 → 服务端 ──────────────────────────────────────────────

message NodeMessage {
  oneof payload {
    Register register = 1;
    Heartbeat heartbeat = 2;
    JudgeResult result = 3;
    RunCodeResult run_code_result = 4;
  }
}

message Register {
  string token = 1;        // JUDGE_GATEWAY_TOKENS 其一；不符即断开
  string node_id = 2;      // 空则服务端按 {hostname}-{pid} 规整
  string name = 3;
  int32 capacity = 4;
  string version = 5;      // 沙箱/执行器版本描述
}

message Heartbeat {
  int32 running_tasks = 1; // load 由服务端按 capacity 计算
  int32 cpu_usage = 2;     // 节点宿主 CPU 使用率（0-100），采集自 /proc/stat；无数据时为 0
  int32 memory_usage = 3;  // 节点宿主内存使用率（0-100），采集自 /proc/meminfo；无数据时为 0
}

message CaseResult {
  string test_case_id = 1;
  string status = 2;       // accepted / wrong_answer / tle / ...
  int32 time_used_ms = 3;
  int32 memory_used_kb = 4; // 预留：RSS 采样接入前为 0
  // [已废弃] 分数由服务端派生；字段号保留维持线格式兼容
  int32 score = 5;
  bytes output = 6;         // 程序输出（已按输出上限截断）；服务端落 MinIO
}

message JudgeResult {
  string submission_id = 1;
  string status = 2;       // 汇总状态（accepted / compile_error / ...）
  // [已废弃] 分数由服务端派生；字段号保留维持线格式兼容
  int32 score = 3;
  int32 time_used_ms = 4;  // 各测试点最大用时
  int32 memory_used_kb = 5;
  string error_message = 6; // 编译/运行错误摘要（≤8KB）
  repeated CaseResult cases = 7;
}

// ── 题目数据拉取 ──────────────────────────────────────────────

message ProblemDataRequest {
  string problem_id = 1;
  string data_version = 2;
}

message FileChunk {
  string path = 1;   // 相对路径：cases/<test_case_id>.in|.out、manifest.json
  bytes content = 2;
}

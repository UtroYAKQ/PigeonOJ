# 站内上传图片（头像 / 海报 / 题面插图）：读取链路是 FastAPI → MinIO 全量转发，
# 冷对象首次可达数秒；在边缘缓存成功响应，命中后由 nginx 静态直出。
# Cache-Control / ETag 仍由后端给出（immutable + 304），这里只做边缘加速。
proxy_cache_path /var/cache/nginx/files levels=1:2 keys_zone=files_cache:10m
                 inactive=30d max_size=2g use_temp_path=off;

server {
    listen 80;
    server_name _;

    # 上传体积上限（测试点 JSON、FPS 题库导入、头像/图片等）；默认 1m 会导致大上传直接 413
    client_max_body_size 512m;

    # 传输压缩：JS/CSS/SVG/JSON 等文本资源 gzip 后体积约为原大小的 1/4~1/3
    # （monaco-editor / 组件库等 vendor chunk 收益最大）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资产：可永久缓存（文件内容变化即换文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 根级健康检查直达后端（避免被 SPA 回退吞掉，生产检查清单依赖此端点）
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 上传图片 / 头像读取：前缀比 /api/ 更长，优先生效；只缓存 GET（上传 POST 不受影响）
    location /api/v1/files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache files_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 304 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 反向代理后端 API（统一响应信封 /api/v1/*）
    # 对应 docker-compose.yml 中 backend 服务名与端口
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FPS 题库批量导入（POST /admin/problems/import）单请求可达数十秒，
        # 放宽读写超时避免大包导入被代理层 504 截断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/brand/favicon.png"
    />
    <title>PigeonOJ</title>
    <script>
      try {
        if (localStorage.getItem('pigeonoj.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {
        /* 隐私模式下忽略 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: "pigeonoj-local"
mode: ONCE
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
keep_caps: false
iface_no_lo: true
# 必须挂载 /proc：glibc 展开 RPATH 的 $ORIGIN 需要 /proc/self/exe，
# 否则 OpenJDK launcher 报 libjli.so 缺失、gcc 子程序定位异常。
# proc 位于独立 PID namespace 内且由 nsjail 以只读方式挂载。
mount_proc: true
cwd: "/sandbox"

# The runner creates a fresh writable /sandbox mount for every invocation.
mount {
  src: "/sandbox"
  dst: "/sandbox"
  is_bind: true
  rw: true
}

# Language runtimes are read-only from the jailed process.
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
  rw: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
}

# gcc 驱动重定向子进程 stdio 需要 /dev/null；Java 需要 /dev/zero、/dev/random。
# 整体只读挂载， jailed 进程不能创建设备节点。
mount {
  src: "/dev"
  dst: "/dev"
  is_bind: true
  rw: false
}

# Conservative defaults; the runner can tighten these per test case.
# as 上限须容纳 JVM 的虚拟地址预留（堆 + CompressedClassSpace + CodeCache 远超 RSS），
# 内存判据按契约以进程峰值 RSS 为准（docs/contracts/judge.md 判题器执行规范）。
rlimit_as: 4096
rlimit_cpu: 5
rlimit_fsize: 16
rlimit_nproc: 32
max_cpus: 1

# The runner supplies a minimal environment explicitly when invoking nsjail.

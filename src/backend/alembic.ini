# Alembic config. Keep this file ASCII-only: Python's configparser reads it
# with the locale encoding (GBK on zh-CN Windows) and would crash on UTF-8
# Chinese comments. Migrations in alembic/versions/ are the single source of
# truth (see docs/contracts/index.md). alembic/env.py injects DATABASE_URL
# from app.config at runtime; sqlalchemy.url stays empty here.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

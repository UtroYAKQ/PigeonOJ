server {
    listen 80;
    server_name _;

    # 上传体积上限（头像 / 题面插图 / FPS 题库导入 ZIP 等）
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Astro 构建产物带内容哈希，可永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro 默认目录格式：/problems/ -> problems/index.html；
    # 同时兼容 file 格式（/problems -> problems.html）与根路径
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # 根级健康检查直达后端（不与前端路由冲突）
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 后端 API 反代（统一信封 /api/v1/*）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FPS 题库批量导入单请求可达数十秒
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PigeonOJ · Scoreboard</title>
    <link rel="stylesheet" href="/scoreboard.css" />
  </head>
  <body>
    <header>
      <div class="brand">P<span>OJ</span></div>
      <div class="heading">
        <div id="modeLabel" class="eyebrow"></div>
        <h1 id="title">PigeonOJ</h1>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <select id="language" aria-label="Language">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option></select
      ><button id="themeBtn" type="button">◐</button
      ><button id="fullscreenBtn" type="button">⛶</button>
    </header>
    <main id="boardWrap" tabindex="0"><div id="loading" role="status">…</div></main>
    <aside id="error" role="alert" hidden></aside>
    <footer>
      <div id="legend" class="legend"></div>
      <div id="revealControls" class="controls" hidden>
        <button id="prevBtn" type="button">←</button
        ><button id="playBtn" class="primary" type="button"></button
        ><button id="nextBtn" type="button">→</button
        ><button id="restartBtn" type="button">↺</button
        ><button id="speedBtn" type="button">×1</button
        ><button id="watchBtn" type="button" hidden></button>
      </div>
      <div id="scrollControls" class="controls">
        <button id="scrollBtn" type="button"></button
        ><button id="scrollSpeedBtn" type="button">↕ ×1</button>
      </div>
      <div class="progress"><strong id="progress">—</strong><span id="updated"></span></div>
    </footer>
    <script type="module" src="/scoreboard.js"></script>
  </body>
</html>

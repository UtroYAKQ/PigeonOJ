server {
    listen 80;
    server_name _;

    # 上传体积上限（测试点 JSON、FPS 题库导入、头像/图片等）；默认 1m 会导致大上传直接 413
    client_max_body_size 512m;

    # 传输压缩：JS/CSS/SVG/JSON 等文本资源 gzip 后体积约为原大小的 1/4~1/3
    # （monaco-editor / naive-ui 等 vendor chunk 收益最大）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资产：可永久缓存（文件内容变化即换文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 根级健康检查直达后端（避免被 SPA 回退吞掉，生产检查清单依赖此端点）
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 反向代理后端 API（统一响应信封 /api/v1/*）
    # 对应 docker-compose.yml 中 backend 服务名与端口
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FPS 题库批量导入（POST /admin/problems/import）单请求可达数十秒，
        # 放宽读写超时避免大包导入被代理层 504 截断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
